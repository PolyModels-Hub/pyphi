[tool.poetry]
name = "pyphi"
version = "0.1.0"
description = "Phi toolbox for multivariate analysis"
authors = [
    "Salvador Garcia-Munoz <salvadorgarciamunoz@gmail.com>",
    "Ethan Lavialle <ethan.lavialle@polymodelshub.com>",
    "Carlos Perez-Galvan <carlos.perez@polymodelshub.com>"
]
license = "MIT"
readme = "README.md"
packages = [{ include = "pyphi", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
bokeh = ">=3.8.1,<4.0.0"
matplotlib = ">=3.10.7,<4.0.0"
numpy = ">=2.3.4,<3.0.0"
openpyxl = ">=3.1.5,<4.0.0"
pandas = ">=2.3.3,<3.0.0"
pyomo = ">=6.9.5,<7.0.0"
scipy = ">=1.16.3,<2.0.0"
xlrd = ">=2.0.2,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pyphi"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 80

[tool.ruff]
src = ["src"]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
